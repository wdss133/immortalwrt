name: ImmortalWrt-IPQ807X-Daily

# ============================================================================
#  每日北京时间 21:00（UTC 13:00）自动执行：
#    1) 同步上游主线 Heleguo/immortalwrt@openwrt-24.10  -> 本仓库 openwrt-24.10
#    2) 克隆本仓库源码树，按 custom/ 配置应用全部定制
#    3) 编译 qualcommax/ipq807x（内核 6.6）
#    4) 发布：滚动 latest + 每次编译一个「时间戳 tag」的新 Release，并写入插件版本表
#    5) 按真实配置重写 README 并回推
#
#  设计约束（为了「上游怎么变都能一直用」）：
#    - 本文件、scripts/custom/*、custom/* 全部是**新增文件**，绝不修改上游既有文件；
#      因此 git merge -X ours 同步上游时永远不会产生真冲突。
#    - 第三方插件一律「探测分支 + 失败重试」后落位到 package/，不依赖 feeds 的分支名。
#    - 唯一硬失败点：argon 主题缺失 / kmod-tun 缺失。其余缺失只告警，不打断流水线。
#
#  ⚠️ 一次性前置设置（必须做，否则同步无法回推、Release 无法创建）：
#     Settings -> Actions -> General -> Workflow permissions
#       请选择 "Read and write permissions"，并勾选 "Allow GitHub Actions to create and approve pull requests"。
#
#  ⚠️ GitHub 只会在**默认分支**上触发 schedule。本仓库默认分支为 openwrt-24.10，
#     所以本文件必须存在于 openwrt-24.10；custom-ipq807x 为镜像分支（可手动 Run workflow）。
# ============================================================================

on:
  schedule:
    # UTC 13:00 == 北京时间 21:00
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '编译前先同步上游主线'
        required: false
        type: boolean
        default: true
      easytier_variant:
        description: 'EasyTier 版本（noweb=预编译二进制，编译快；full=源码编译，很慢）'
        required: false
        type: choice
        options:
          - noweb
          - full
        default: noweb
      keep_days:
        description: '时间戳 Release 保留天数（超过则自动清理）'
        required: false
        type: string
        default: '30'

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  OPENWRT_PATH: /mnt/openwrt
  # 上游（被同步的对象）与本仓库源码
  UPSTREAM_REPO: https://github.com/Heleguo/immortalwrt.git
  UPSTREAM_BRANCH: openwrt-24.10
  SOURCE_REPO: https://github.com/wdss133/immortalwrt.git
  SOURCE_BRANCH: openwrt-24.10
  # 定制分支（镜像 / 覆盖源）
  CUSTOM_BRANCH: custom-ipq807x
  CUSTOM_DIR: custom
  # 编译目标
  TARGET_BOARD: qualcommax
  TARGET_SUBTARGET: ipq807x
  TARGET_ID: qualcommax_ipq807x
  KERNEL_FILE: kernel-6.6
  # 自有文件位置
  DEVICE_CONFIG: custom/IPQ807X.config
  GENERAL_CONFIG: custom/General.config
  CUSTOM_SCRIPT: scripts/custom/immortalwrt-customize.sh
  # 产物 / 发布
  ARTIFACT_PREFIX: IPQ807X-ImmortalWrt
  RELEASE_PREFIX: IPQ807X-ImmortalWrt
  KEEP_DAYS: "30"

jobs:

  # -------------------------------------------------------------------------
  # 1) 同步上游主线 -> 本仓库 openwrt-24.10（并尽力把结果同步到定制分支）
  # -------------------------------------------------------------------------
  Sync-Upstream:
    if: ${{ github.event_name == 'schedule' || inputs.sync_upstream }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.repository.default_branch }}

    - name: Sync Upstream(同步上游主线)
      id: sync
      env:
        GH_TOKEN: ${{ github.token }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -Eeuo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add upstream "$UPSTREAM_REPO" 2>/dev/null \
          || git remote set-url upstream "$UPSTREAM_REPO"
        git fetch --no-tags upstream "$UPSTREAM_BRANCH"

        # 本仓库只在默认分支上「新增」自有文件，理论上永远不会有真冲突；
        # 万一上游新建了同名文件，-X ours 保留本仓库版本，绝不让流水线中断。
        if git merge --no-edit -X ours "upstream/$UPSTREAM_BRANCH"; then
          if git push origin "HEAD:$DEFAULT_BRANCH"; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "上游主线已同步并推送 ($DEFAULT_BRANCH)"
          else
            echo "synced=local" >> "$GITHUB_OUTPUT"
            echo "::warning::同步结果未能推送（GITHUB_TOKEN 可能只读），本次使用已合并的本地副本编译"
          fi
          # 尽力把默认分支状态同步到定制分支；失败不影响编译
          if git ls-remote --exit-code --heads origin "$CUSTOM_BRANCH" >/dev/null 2>&1; then
            if git push origin "HEAD:$CUSTOM_BRANCH"; then
              echo "定制分支 $CUSTOM_BRANCH 已同步"
            else
              echo "::warning::定制分支 $CUSTOM_BRANCH 未能快进同步（可能已分叉），不影响编译"
            fi
          fi
        else
          git merge --abort || true
          echo "synced=false" >> "$GITHUB_OUTPUT"
          echo "::warning::上游同步出现冲突，已保留本仓库版本继续编译"
        fi

  # -------------------------------------------------------------------------
  # 2) 编译 IPQ807X
  # -------------------------------------------------------------------------
  Build:
    needs: Sync-Upstream
    # 显式 if：Sync-Upstream 被跳过时（sync_upstream=false）也要能编译
    if: ${{ always() && needs.Sync-Upstream.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    outputs:
      version_kernel: ${{ steps.source.outputs.version_kernel }}
      source_hash: ${{ steps.source.outputs.source_hash }}
      artifact_name: ${{ steps.variables.outputs.artifact_name }}
    concurrency:
      group: immortalwrt-ipq807x-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "CPU核心信息：$(grep name /proc/cpuinfo | cut -f2 -d: | uniq -c)"
        df -hT

    - name: Initialization Environment(初始化编译环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
          genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Checkout(检出 CI 侧文件)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Fetch Custom Overlay(拉取定制分支配置)
      run: |
        set -Eeuo pipefail
        if git ls-remote --exit-code --heads origin "$CUSTOM_BRANCH" >/dev/null 2>&1; then
          git fetch --depth=1 --no-tags origin "$CUSTOM_BRANCH"
          if git checkout FETCH_HEAD -- "$CUSTOM_DIR"; then
            echo "已应用 $CUSTOM_BRANCH 分支的定制配置"
            ls -l "$CUSTOM_DIR"
          else
            echo "::warning::$CUSTOM_BRANCH 分支没有 $CUSTOM_DIR 目录，使用当前分支默认配置"
          fi
        else
          echo "::warning::未找到分支 $CUSTOM_BRANCH，使用当前分支默认配置"
        fi

    - name: Clone Source Code(克隆源码树)
      id: source
      run: |
        set -Eeuo pipefail
        df -hT "$GITHUB_WORKSPACE"
        sudo mkdir -p "$OPENWRT_PATH"
        sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
        for attempt in 1 2 3; do
          if git clone --depth 1 -b "$SOURCE_BRANCH" --single-branch "$SOURCE_REPO" "$OPENWRT_PATH"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: source clone failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::源码克隆失败 (attempt $attempt/3)，重试中"
          sudo rm -rf "$OPENWRT_PATH"
          sudo mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          sleep $((attempt * 5))
        done

        cd "$OPENWRT_PATH"

        # ---- 源码与上游一致性检查（best-effort）----
        # Sync-Upstream 已把上游合并回推到本仓库；万一回推失败（GITHUB_TOKEN 只读等），
        # 这里再自行对齐一次，确保「同步后编译」这条要求始终成立。
        # 全部改动只针对源码树，定制文件来自 $GITHUB_WORKSPACE，因此对齐不会影响定制。
        UP_SHA="$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" 2>/dev/null | awk '{print $1}')"
        MY_SHA="$(git rev-parse HEAD)"
        if [ -z "$UP_SHA" ]; then
          echo "::warning::无法查询上游 HEAD，跳过源码对齐检查"
        elif [ "$UP_SHA" = "$MY_SHA" ]; then
          echo "源码树已等于上游 HEAD（${MY_SHA:0:7}）"
        else
          echo "源码树 HEAD=${MY_SHA:0:7}  上游 HEAD=${UP_SHA:0:7}  -> 尝试对齐到上游最新"
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          if git fetch --no-tags --depth=100 upstream "$UPSTREAM_BRANCH" 2>/dev/null; then
            UP_REF="$(git rev-parse FETCH_HEAD)"
            git fetch --no-tags --depth=100 origin "$SOURCE_BRANCH" >/dev/null 2>&1 || true
            if git merge --no-edit -X ours "$UP_REF" >/dev/null 2>&1; then
              echo "源码树已对齐到上游 ${UP_REF:0:7}"
            else
              git merge --abort >/dev/null 2>&1 || true
              git checkout -f HEAD >/dev/null 2>&1 || true
              echo "::warning::源码树无法与上游合并（历史过浅或已分叉），沿用本仓库当前状态，不影响编译"
            fi
          else
            echo "::warning::上游拉取失败，沿用本仓库当前状态，不影响编译"
          fi
        fi

        VERSION_INFO="$(git show -s --date=short --format="作者: %an<br/>时间: %cd<br/>内容: %s<br/>hash: %H")"
        {
          echo "version_info<<EOF"
          echo "$VERSION_INFO"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        # 动态解析内核版本，上游换内核（6.6 -> 6.12）也不会失效
        VERSION_KERNEL=""
        for kf in target/linux/*/"$KERNEL_FILE" target/linux/*/config-6.6 target/linux/*/config-6.12; do
          [ -f "$kf" ] || continue
          v="$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' "$kf" | head -n 1 || true)"
          [ -n "$v" ] && { VERSION_KERNEL="$v"; break; }
        done
        echo "version_kernel=${VERSION_KERNEL:-unknown}" >> "$GITHUB_OUTPUT"
        echo "source_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Disable Mainland Mirrors(屏蔽大陆下载源)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        mirror_file="scripts/projectsmirrors.json"
        if [ -f "$mirror_file" ]; then
          jq '
            with_entries(
              .value |= map(select(
                test("^https?://(mirrors\\.tencent\\.com|mirrors\\.aliyun\\.com|mirrors\\.tuna\\.tsinghua\\.edu\\.cn|mirrors\\.ustc\\.edu\\.cn|mirror\\.iscas\\.ac\\.cn|mirror\\.nju\\.edu\\.cn)(/|$)")
                | not
              ))
            )
          ' "$mirror_file" > "$mirror_file.tmp"
          mv "$mirror_file.tmp" "$mirror_file"
        else
          echo "::warning::未找到 $mirror_file，跳过镜像处理"
        fi
        [ -f scripts/download.pl ] && sed -i '/raw\.gitmirror\.com/d' scripts/download.pl || true

    - name: Generate Variables(生成缓存与产物变量)
      id: variables
      env:
        SOURCE_HASH: ${{ steps.source.outputs.source_hash }}
      run: |
        set -Eeuo pipefail
        CUSTOMIZATION_HASH="${{ hashFiles('scripts/custom/immortalwrt-customize.sh', 'custom/General.config', 'custom/IPQ807X.config', 'custom/packages.seed', 'custom/devices.include', 'custom/devices.exclude') }}"
        CUSTOMIZATION_HASH="${CUSTOMIZATION_HASH:0:7}"
        CACHE_PREFIX="immortalwrt-${TARGET_ID}-24.10"
        {
          echo "CCACHE_KEY=${CACHE_PREFIX}-ccache-${CUSTOMIZATION_HASH}-${SOURCE_HASH}"
          echo "STAGING_KEY=${CACHE_PREFIX}-staging-${CUSTOMIZATION_HASH}-${SOURCE_HASH}"
          echo "CCACHE_RESTORE_PREFIX=${CACHE_PREFIX}-ccache-"
          echo "STAGING_RESTORE_PREFIX=${CACHE_PREFIX}-staging-"
        } >> "$GITHUB_ENV"
        echo "artifact_name=firmware-${ARTIFACT_PREFIX}" >> "$GITHUB_OUTPUT"

    - name: Cache Ccache(缓存编译结果)
      uses: actions/cache@v4
      with:
        key: ${{ env.CCACHE_KEY }}
        restore-keys: ${{ env.CCACHE_RESTORE_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/.ccache

    - name: Cache Staging Directory(缓存工具链)
      uses: actions/cache@v4
      with:
        key: ${{ env.STAGING_KEY }}
        restore-keys: ${{ env.STAGING_RESTORE_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Update Feeds(更新feeds)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply Customization(应用全部定制)
      env:
        EASYTIER_VARIANT: ${{ inputs.easytier_variant || 'noweb' }}
        CUSTOM_WORKSPACE: ${{ github.workspace }}
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        chmod +x "$GITHUB_WORKSPACE/$CUSTOM_SCRIPT"
        CUSTOM_DIR="$GITHUB_WORKSPACE/$CUSTOM_DIR" \
        GENERAL_CONFIG="$GITHUB_WORKSPACE/$GENERAL_CONFIG" \
        DEVICE_CONFIG="$GITHUB_WORKSPACE/$DEVICE_CONFIG" \
        EASYTIER_VARIANT="$EASYTIER_VARIANT" \
        TARGET_ID="$TARGET_ID" \
        ARTIFACT_PREFIX="$ARTIFACT_PREFIX" \
          "$GITHUB_WORKSPACE/$CUSTOM_SCRIPT" "$GITHUB_WORKSPACE/$CUSTOM_DIR"

    - name: Generate Final Config(生成最终配置)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        cat "$GITHUB_WORKSPACE/$DEVICE_CONFIG" "$GITHUB_WORKSPACE/$GENERAL_CONFIG" > .config
        echo "---- iStore 落位自检 ----"
        for p in luci-app-store luci-lib-taskd luci-lib-xterm taskd; do
          if [ -f "package/$p/Makefile" ]; then
            echo "  package/$p/Makefile: EXISTS"
          else
            echo "  package/$p/Makefile: MISSING"
          fi
        done
        echo "---- aurora 残留检查 ----"
        find package feeds -maxdepth 4 -type d -iname '*aurora*' 2>/dev/null | sed 's/^/  LEFT: /' || true
        make defconfig
        echo "---- 关键项自检 ----"
        for sym in CONFIG_PACKAGE_kmod-tun CONFIG_PACKAGE_luci-theme-argon \
                   CONFIG_PACKAGE_luci-app-argon-config \
                   CONFIG_PACKAGE_zerotier CONFIG_PACKAGE_luci-app-zerotier \
                   CONFIG_PACKAGE_easytier-noweb CONFIG_PACKAGE_luci-app-easytier \
                   CONFIG_PACKAGE_ddns-go CONFIG_PACKAGE_luci-app-ddns-go \
                   CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_luci-lib-taskd \
                   CONFIG_PACKAGE_luci-app-wechatpush; do
          if grep -q "^${sym}=[ym]" .config; then
            echo "OK   ${sym}"
          else
            echo "::warning::最终配置中缺少 ${sym}（依赖不满足或上游改名，不影响编译继续）"
          fi
        done
        if grep -qE "^CONFIG_PACKAGE_.*aurora.*=[ym]" .config; then
          echo "::warning::Aurora 主题仍被选中，请检查定制脚本"
        else
          echo "OK   Aurora 已移除"
        fi
        echo "---- 机型数量 ----"
        echo "  $(grep -c '^CONFIG_TARGET_DEVICE_.*=y' .config) 个机型"

    - name: Download DL Package(下载DL软件包)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        if [ -d staging_dir ]; then
          tools_stamp="$(find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -print -quit 2>/dev/null || true)"
          if [ -n "$tools_stamp" ]; then
            find staging_dir/host/stamp -maxdepth 1 -type f ! -name '.tools_compile*' -exec touch {} + 2>/dev/null || true
            find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -exec touch {} +
          fi
          for toolchain_dir in staging_dir/toolchain-*; do
            [ -d "$toolchain_dir" ] || continue
            toolchain_stamp="$(find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -print -quit)"
            [ -n "$toolchain_stamp" ] || continue
            if [ -d "$toolchain_dir/stamp" ]; then
              find "$toolchain_dir/stamp" -maxdepth 1 -type f ! -name '.toolchain_compile*' -exec touch {} +
            fi
            find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -exec touch {} +
          done
        fi
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: make download failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::make download 失败 (attempt $attempt/3)，清理不完整文件后重试"
          find dl -type f -size -1024c -print -delete
          sleep $((attempt * 5))
        done

    - name: Compile Firmware(开始编译固件)
      run: |
        cd "$OPENWRT_PATH"
        echo -e "$(nproc) thread compile"
        make -j"$(nproc)" || make -j1 V=s

    - name: Check Space Usage(检查空间使用情况)
      if: ${{ !cancelled() }}
      run: df -hT

    - name: Organize Files(整理文件)
      id: organize
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"/bin/targets/*/*
        cp "$OPENWRT_PATH/.config" "$ARTIFACT_PREFIX.config"
        [ -f config.buildinfo ] && mv config.buildinfo "$ARTIFACT_PREFIX.config.buildinfo" || true
        manifest_file="$(ls ./*.manifest 2>/dev/null | head -n 1 || true)"
        [ -n "$manifest_file" ] && mv "$manifest_file" "$ARTIFACT_PREFIX.manifest" || echo "::warning::未找到 manifest 文件"
        mkdir -p packages
        package_count=0
        while IFS= read -r -d '' package_file; do
          mv -f "$package_file" packages/
          package_count=$((package_count + 1))
        done < <(find "$OPENWRT_PATH/bin/packages" -type f \( -name '*.apk' -o -name '*.ipk' \) -print0 2>/dev/null || true)
        if [ "$package_count" -gt 0 ]; then
          tar -zcf "$ARTIFACT_PREFIX.Packages.tar.gz" packages
        else
          echo "::warning::未在 bin/packages 下找到软件包，跳过打包"
          rm -rf packages
        fi
        [ -s "$OPENWRT_PATH/third-party-sources.txt" ] \
          && cp "$OPENWRT_PATH/third-party-sources.txt" "$ARTIFACT_PREFIX.third-party-sources.txt" \
          || echo "::warning::未生成 third-party-sources.txt"
        if [ -f "$OPENWRT_PATH/$ARTIFACT_PREFIX.plugins.md" ]; then
          cp "$OPENWRT_PATH/$ARTIFACT_PREFIX.plugins.md" "$ARTIFACT_PREFIX.plugins.md"
        else
          echo "::warning::未生成插件信息文件 $ARTIFACT_PREFIX.plugins.md"
        fi
        rm -rf feeds.buildinfo version.buildinfo sha256sums profiles.json
        echo "firmware_path=$PWD" >> "$GITHUB_OUTPUT"

    - name: Upload Firmware Artifact(上传固件产物)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.ARTIFACT_PREFIX }}
        path: ${{ steps.organize.outputs.firmware_path }}/*
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 3

  # -------------------------------------------------------------------------
  # 3) 发布：滚动 latest + 每次编译一个时间戳 tag 的新 Release
  # -------------------------------------------------------------------------
  Release:
    needs: Build
    if: ${{ always() && needs.Build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download Firmware Artifact(下载固件产物)
      uses: actions/download-artifact@v4
      with:
        name: firmware-${{ env.ARTIFACT_PREFIX }}
        path: artifacts/firmware

    - name: Release & Prune(发布固件并清理旧版本)
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_KERNEL: ${{ needs.Build.outputs.version_kernel }}
        SOURCE_HASH: ${{ needs.Build.outputs.source_hash }}
        KEEP_DAYS: ${{ inputs.keep_days || '30' }}
      run: |
        set -Eeuo pipefail
        chmod +x "$GITHUB_WORKSPACE/scripts/custom/release.sh"
        "$GITHUB_WORKSPACE/scripts/custom/release.sh" \
          "$GITHUB_WORKSPACE/artifacts/firmware" "$RELEASE_PREFIX" "${KEEP_DAYS:-30}"

  # -------------------------------------------------------------------------
  # 4) 按真实配置重写 README（含各插件最新版本号与上游更新日期）
  # -------------------------------------------------------------------------
  Docs:
    needs: [Sync-Upstream, Release]
    # 即使上游被跳过、编译/发布失败也要更新 README，让文档始终与仓库实际配置一致
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch Custom Overlay(拉取定制分支配置)
      run: |
        set -Eeuo pipefail
        if git ls-remote --exit-code --heads origin "$CUSTOM_BRANCH" >/dev/null 2>&1; then
          git fetch --depth=1 --no-tags origin "$CUSTOM_BRANCH"
          rm -rf .tmp-custom && mkdir -p .tmp-custom
          git archive FETCH_HEAD "$CUSTOM_DIR" 2>/dev/null | tar -x -C .tmp-custom || true
          if [ -d ".tmp-custom/$CUSTOM_DIR" ]; then
            rm -rf "$CUSTOM_DIR"; cp -a ".tmp-custom/$CUSTOM_DIR" "$CUSTOM_DIR"
          fi
          rm -rf .tmp-custom
        fi

    - name: Collect Plugin Table(采集最新发布的插件版本表)
      id: plugins
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        out="$GITHUB_WORKSPACE/.plugins-table.md"
        : > "$out"
        if command -v gh >/dev/null 2>&1; then
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
                  --jq '[.[] | select(.tagName|endswith("-latest"))][0].tagName' 2>/dev/null || true)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          fi
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            echo "读取发布说明来源: $tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > .release-body.md 2>/dev/null || true
            awk '/<!--PLUGINS:BEGIN-->/{f=1;next} /<!--PLUGINS:END-->/{f=0} f' .release-body.md > "$out" || true
          else
            echo "::warning::仓库中还没有任何 Release，插件版本表暂缺"
          fi
        fi
        echo "plugin_table=$out" >> "$GITHUB_OUTPUT"
        echo "---- 采集结果预览 ----"
        head -n 20 "$out" || true

    - name: Regenerate README(按实际配置重写 README)
      env:
        KEEP_DAYS: ${{ env.KEEP_DAYS }}
        PLUGIN_TABLE: ${{ steps.plugins.outputs.plugin_table }}
      run: |
        set -Eeuo pipefail
        chmod +x scripts/custom/gen-readme.sh
        scripts/custom/gen-readme.sh "$GITHUB_WORKSPACE" "$PLUGIN_TABLE"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ -n "$(git status --porcelain README.md)" ]; then
          git add README.md
          git commit -m "docs: regenerate README from current configuration"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-$SOURCE_BRANCH}" || true
          git push origin "HEAD:${GITHUB_REF_NAME:-$SOURCE_BRANCH}" \
            || echo "::warning::README 推送失败（可能权限/冲突），不影响编译"
        else
          echo "README 无变化"
        fi
