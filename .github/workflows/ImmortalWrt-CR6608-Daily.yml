name: ImmortalWrt-CR6608-Daily

# ============================================================================
#  小米 CR6608（MT7621 / ramips-mt7621）固件每日自动编译
#
#  每天北京时间 21:00（UTC 13:00）自动执行：
#    1) 同步上游主线 Heleguo/immortalwrt@openwrt-24.10 -> 本仓库 openwrt-24.10
#       （Heleguo fork = immortalwrt + MTK 闭源无线驱动 + MTK PPE 补丁，必须用它，
#         换回 immortalwrt 官方源会丢掉 package/mtk 与 ramips 硬加速补丁）
#    2) 克隆本仓库源码树，按 .config + custom/ 应用全部定制
#    3) 编译 ramips/mt7621 的 xiaomi_mi-router-cr6608
#    4) 发布：滚动 latest + 每次编译一个「时间戳 tag」的新 Release，并写入插件版本表
#    5) 按真实配置重写 README 并回推
#
#  设计约束（为了「上游怎么变都能一直用」）：
#    - 本仓库文件全部是**新增文件**，不改动上游既有文件；
#      因此 git merge -X ours 同步上游时永远不会产生真冲突。
#    - 第三方插件一律「探测分支 + 失败重试 + 架构兼容过滤」后落位到 package/。
#    - MTK 闭源无线驱动按需自动补 Build/Prepare；若最终未进入配置则自动回退开源 mt76/wpad。
#    - 硬失败点只有：argon 主题缺失 / kmod-tun 缺失 / 固件产物缺失。
#
#  ⚠️ 一次性前置设置（必须做，否则同步无法回推、Release 无法创建）：
#     Settings -> Actions -> General -> Workflow permissions
#       选择 "Read and write permissions"，并勾选 "Allow GitHub Actions to create and approve pull requests"
#
#  ⚠️ GitHub 只会在**默认分支**上触发 schedule。本仓库默认分支为 openwrt-24.10，
#     所以本文件必须存在于 openwrt-24.10；custom-cr6608 为镜像分支（可手动 Run workflow）。
# ============================================================================

on:
  schedule:
    # UTC 13:00 == 北京时间 21:00
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      sync_upstream:
        description: '编译前先同步上游主线'
        required: false
        type: boolean
        default: true
      upload_release:
        description: '编译成功后发布 Release'
        required: false
        type: boolean
        default: true
      mtk_wifi:
        description: 'MTK 闭源无线（on=用 MTK 驱动；off=用开源 mt76/wpad；auto=先试 MTK，失败自动回退）'
        required: false
        type: choice
        options:
          - auto
          - 'on'
          - 'off'
        default: auto
      easytier_variant:
        description: 'EasyTier 版本（noweb=预编译二进制，快；full=源码编译，慢）'
        required: false
        type: choice
        options:
          - noweb
          - full
        default: noweb
  push:
    branches:
      - openwrt-24.10
    # 只有 CI 自己的文件变化才触发，README 自动提交不会引起循环
    paths:
      - '.config'
      - 'custom/**'
      - 'scripts/**'
      - '.github/workflows/ImmortalWrt-CR6608-Daily.yml'

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

env:
  TZ: Asia/Shanghai
  OPENWRT_PATH: /mnt/openwrt
  # 上游（被同步的对象）：Heleguo fork = immortalwrt + MTK 闭源无线 + MTK PPE 补丁
  UPSTREAM_REPO: https://github.com/Heleguo/immortalwrt.git
  UPSTREAM_BRANCH: openwrt-24.10
  # 本仓库源码
  SOURCE_REPO: https://github.com/wdss133/immortalwrt.git
  SOURCE_BRANCH: openwrt-24.10
  # 定制镜像 / 覆盖分支
  CUSTOM_BRANCH: custom-cr6608
  CUSTOM_DIR: custom
  # 目标：小米 CR6608（MT7621，ramips/mt7621）
  TARGET_BOARD: ramips
  TARGET_SUBTARGET: mt7621
  TARGET_ID: ramips_mt7621
  DEVICE: xiaomi_mi-router-cr6608
  # 产物 / 发布
  ARTIFACT_PREFIX: CR6608
  RELEASE_PREFIX: CR6608
  KEEP_RECENT: "36"

jobs:

  # -------------------------------------------------------------------------
  # 1) 同步上游主线 -> 本仓库默认分支（并尽力把结果快进到定制分支）
  # -------------------------------------------------------------------------
  Sync-Upstream:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.sync_upstream }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      synced: ${{ steps.sync.outputs.synced }}
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.repository.default_branch }}

    - name: Sync Upstream(同步上游主线)
      id: sync
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -Eeuo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        git remote add upstream "$UPSTREAM_REPO" 2>/dev/null \
          || git remote set-url upstream "$UPSTREAM_REPO"
        git fetch --no-tags upstream "$UPSTREAM_BRANCH"

        # 本仓库只在默认分支上「新增」自有文件，理论上永远不会有真冲突；
        # 万一上游新建了同名文件，-X ours 保留本仓库版本，绝不让流水线中断。
        if git merge --no-edit -X ours "upstream/$UPSTREAM_BRANCH"; then
          if git push origin "HEAD:$DEFAULT_BRANCH"; then
            echo "synced=true" >> "$GITHUB_OUTPUT"
            echo "上游主线已同步并推送 ($DEFAULT_BRANCH)"
          else
            echo "synced=local" >> "$GITHUB_OUTPUT"
            echo "::warning::同步结果未能推送（GITHUB_TOKEN 可能只读），本次使用已合并的本地副本编译"
          fi
          # 尽力把默认分支状态快进到定制分支；失败不影响编译
          if git ls-remote --exit-code --heads origin "$CUSTOM_BRANCH" >/dev/null 2>&1; then
            git push origin "HEAD:$CUSTOM_BRANCH" >/dev/null 2>&1 \
              && echo "定制分支 $CUSTOM_BRANCH 已同步" \
              || echo "::warning::定制分支 $CUSTOM_BRANCH 未能快进同步（可能已分叉），不影响编译"
          fi
        else
          git merge --abort || true
          echo "synced=false" >> "$GITHUB_OUTPUT"
          echo "::warning::上游同步出现冲突，已保留本仓库版本继续编译"
        fi

  # -------------------------------------------------------------------------
  # 2) 编译 CR6608
  # -------------------------------------------------------------------------
  Build:
    needs: Sync-Upstream
    # 显式 if：Sync-Upstream 被跳过时也要能编译
    if: ${{ always() && needs.Sync-Upstream.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: read
      actions: read
    outputs:
      kernel_version: ${{ steps.organize.outputs.kernel_version }}
      source_commit: ${{ steps.source.outputs.source_commit }}
      artifact_name: ${{ steps.variables.outputs.artifact_name }}
      mtk_state: ${{ steps.compile.outputs.mtk_state || steps.finalconfig.outputs.mtk_state }}
    concurrency:
      group: immortalwrt-cr6608-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Check Server Performance(检查服务器性能)
      run: |
        echo "CPU核心信息：$(grep name /proc/cpuinfo | cut -f2 -d: | uniq -c)"
        df -hT

    - name: Initialization Environment(初始化编译环境)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib \
          git gperf haveged help2man intltool jq libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
          libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libfuse-dev libssl-dev libtool lrzsz \
          genisoimage msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip libpython3-dev qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"
        df -hT /mnt

    - name: Clone Source Code(克隆源码树)
      id: source
      run: |
        set -Eeuo pipefail
        sudo mkdir -p "$OPENWRT_PATH"
        sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
        for attempt in 1 2 3; do
          if git clone --depth 1 -b "$SOURCE_BRANCH" --single-branch "$SOURCE_REPO" "$OPENWRT_PATH"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: source clone failed after $attempt attempts" >&2
            exit 1
          fi
          echo "::warning::源码克隆失败 (attempt $attempt/3)，重试中"
          sudo rm -rf "$OPENWRT_PATH"; mkdir -p "$OPENWRT_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$OPENWRT_PATH"
          sleep $((attempt * 5))
        done

        cd "$OPENWRT_PATH"

        # ---- 源码与上游一致性检查（best-effort）----
        # Sync-Upstream 已把上游合并回推到本仓库；万一回推失败（token 只读等），
        # 这里再自行对齐一次，保证「同步后编译」始终成立。定制文件都在本仓库内，
        # 对齐不会丢失定制，只会把上游新提交拉进来。
        UP_SHA="$(git ls-remote "$UPSTREAM_REPO" "refs/heads/$UPSTREAM_BRANCH" 2>/dev/null | awk '{print $1}')"
        MY_SHA="$(git rev-parse HEAD)"
        if [ -z "$UP_SHA" ]; then
          echo "::warning::无法查询上游 HEAD，跳过源码对齐检查"
        elif [ "$UP_SHA" = "$MY_SHA" ]; then
          echo "源码树已等于上游 HEAD（${MY_SHA:0:7}）"
        else
          echo "源码树 HEAD=${MY_SHA:0:7}  上游 HEAD=${UP_SHA:0:7}  -> 尝试合并上游最新提交"
          git remote add upstream "$UPSTREAM_REPO" 2>/dev/null || git remote set-url upstream "$UPSTREAM_REPO"
          if git fetch --no-tags --depth=100 upstream "$UPSTREAM_BRANCH" 2>/dev/null; then
            UP_REF="$(git rev-parse FETCH_HEAD)"
            git fetch --no-tags --depth=100 origin "$SOURCE_BRANCH" >/dev/null 2>&1 || true
            if git merge --no-edit -X ours "$UP_REF" >/dev/null 2>&1; then
              echo "源码树已合并上游 ${UP_REF:0:7}"
            else
              git merge --abort >/dev/null 2>&1 || true
              git checkout -f HEAD >/dev/null 2>&1 || true
              echo "::warning::源码树无法与上游合并（历史过浅或已分叉），沿用本仓库当前状态，不影响编译"
            fi
          else
            echo "::warning::上游拉取失败，沿用本仓库当前状态，不影响编译"
          fi
        fi

        echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "源码提交：$(git rev-parse --short HEAD)"

    - name: Generate Variables(生成缓存与产物变量)
      id: variables
      env:
        SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
      run: |
        set -Eeuo pipefail
        CUSTOMIZATION_HASH="${{ hashFiles('.config', 'custom/packages.seed', 'custom/devices.include', 'custom/devices.exclude', 'scripts/custom/customize.sh') }}"
        CUSTOMIZATION_HASH="${CUSTOMIZATION_HASH:0:7}"
        CACHE_PREFIX="immortalwrt-cr6608-24.10"
        {
          echo "CCACHE_KEY=${CACHE_PREFIX}-ccache-${CUSTOMIZATION_HASH}-${SOURCE_COMMIT:0:7}"
          echo "STAGING_KEY=${CACHE_PREFIX}-staging-${CUSTOMIZATION_HASH}-${SOURCE_COMMIT:0:7}"
          echo "CCACHE_RESTORE_PREFIX=${CACHE_PREFIX}-ccache-"
          echo "STAGING_RESTORE_PREFIX=${CACHE_PREFIX}-staging-"
        } >> "$GITHUB_ENV"
        echo "artifact_name=firmware-${ARTIFACT_PREFIX}" >> "$GITHUB_OUTPUT"

    - name: Cache Ccache(缓存编译结果)
      uses: actions/cache@v4
      with:
        key: ${{ env.CCACHE_KEY }}
        restore-keys: ${{ env.CCACHE_RESTORE_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/.ccache

    - name: Cache Staging Directory(缓存工具链)
      uses: actions/cache@v4
      with:
        key: ${{ env.STAGING_KEY }}
        restore-keys: ${{ env.STAGING_RESTORE_PREFIX }}
        path: ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Update Feeds(更新feeds)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Apply Customization(应用全部定制)
      env:
        EASYTIER_VARIANT: ${{ inputs.easytier_variant || 'noweb' }}
        MTK_WIFI: ${{ inputs.mtk_wifi || 'auto' }}
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        chmod +x scripts/custom/*.sh
        ./scripts/custom/customize.sh "$OPENWRT_PATH/$CUSTOM_DIR"

    - name: Generate Final Config(生成最终配置并自检)
      id: finalconfig
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        # 源码树就是本仓库，仓库根的 .config 直接作为构建种子（customize.sh 已在原地改过它）
        [ -s .config ] || { echo "::error::未找到 .config 种子文件"; exit 1; }
        cp -f .config /tmp/seed.config
        make defconfig

        # ---- 诊断：哪些请求的包被 defconfig 静默丢弃（多为 PROVIDES 虚拟名或依赖不满足）----
        # 用逐项校验而不是 comm 比较：comm 对排序/语言环境敏感，曾出现「实际丢了却报全部保留」的误报。
        dropped=""
        while IFS= read -r sym; do
          [ -n "$sym" ] || continue
          grep -qE "^${sym}=[ym]$" .config || dropped="${dropped}${sym} "
        done < <(grep -oE '^CONFIG_PACKAGE_[^=]+(?==y$)' /tmp/seed.config | sort -u || true)

        if [ -n "$dropped" ]; then
          echo "::warning::以下包在 make defconfig 后被丢弃（虚拟名/依赖不满足/上游改名）："
          for s in $dropped; do
            echo "    dropped: $s"
            p="${s#CONFIG_PACKAGE_}"
            echo "    --- ${p} 的 Kconfig 依赖 ---"
            awk -v pat="config PACKAGE_${p}$" 'index($0,pat)==1{f=1} f{print "      "$0} f&&/^\t\thelp/{f=0}' tmp/.config-package.in 2>/dev/null | head -16 || true
          done
          printf '%s\n' "$dropped" > "$OPENWRT_PATH/.ci-dropped.txt"
        else
          echo "请求的包全部保留"
        fi

        # ---- MTK 闭源无线落位校验；未进入配置则自动回退开源 mt76/wpad ----
        MTK_STATE="off"
        if grep -q '^CONFIG_PACKAGE_kmod-mt7915=y' .config; then
          MTK_STATE="on"
          echo "OK   MTK 闭源无线已进入最终配置"
        elif [ "${MTK_WIFI:-auto}" != "off" ]; then
          echo "::warning::MTK 闭源无线未进入最终配置（依赖不满足/上游结构变化），自动回退开源 mt76/wpad"
          ./scripts/custom/fallback-openwrt-wifi.sh
          MTK_STATE="fallback"
        fi
        echo "mtk_state=$MTK_STATE" >> "$GITHUB_OUTPUT"

        echo "---- libustream-ssl 变体数量（必须为 1）----"
        cnt="$(grep -cE '^CONFIG_PACKAGE_libustream-(openssl|mbedtls|wolfssl)=y' .config || true)"
        echo "  libustream 变体数: $cnt"
        [ "$cnt" -eq 1 ] || { echo "::error::libustream-ssl 变体数量必须为 1（当前 $cnt）"; exit 1; }

        echo "---- 关键项自检 ----"
        # 机型符号有两种合法写法：
        #   A) CONFIG_TARGET_<board>_<subtarget>_DEVICE_<name>          （单选 choice，由 TARGET_PROFILE 推导）
        #   B) CONFIG_TARGET_DEVICE_<board>_<subtarget>_DEVICE_<name>   （仅当 CONFIG_TARGET_MULTI_PROFILE=y 时存在）
        # 本仓库 .config 用的是 A，这里两种都认。
        DEV_A="CONFIG_TARGET_${TARGET_ID}_DEVICE_${DEVICE}"
        DEV_B="CONFIG_TARGET_DEVICE_${TARGET_ID}_DEVICE_${DEVICE}"
        echo "  TARGET_PROFILE = $(grep -m1 '^CONFIG_TARGET_PROFILE=' .config || echo '(未设置)')"
        echo "  已选机型（$DEV_A / $DEV_B）："
        grep -E '^CONFIG_TARGET_[A-Za-z0-9_]*DEVICE_[^=]*=y' .config | sed 's/^/    /' || true

        fail=0
        for sym in CONFIG_PACKAGE_kmod-tun CONFIG_PACKAGE_luci-theme-argon CONFIG_TARGET_ramips_mt7621; do
          if grep -q "^${sym}=y" .config; then
            echo "OK   ${sym}"
          else
            echo "::error::关键项未选中: ${sym}"; fail=1
          fi
        done
        if grep -qE "^(${DEV_A}|${DEV_B})=y" .config; then
          echo "OK   目标机型 ${DEVICE}"
        else
          echo "::error::目标机型 ${DEVICE} 未选中（既非 $DEV_A 也非 $DEV_B）"; fail=1
        fi
        for sym in CONFIG_PACKAGE_zerotier CONFIG_PACKAGE_luci-app-zerotier \
                   CONFIG_PACKAGE_easytier-noweb CONFIG_PACKAGE_luci-app-easytier \
                   CONFIG_PACKAGE_ddns-go CONFIG_PACKAGE_luci-app-ddns-go \
                   CONFIG_PACKAGE_luci-app-store CONFIG_PACKAGE_luci-app-wechatpush \
                   CONFIG_PACKAGE_luci-app-wol CONFIG_PACKAGE_luci-app-upnp; do
          grep -q "^${sym}=y" .config && echo "OK   ${sym}" \
            || echo "::warning::缺少 ${sym}（依赖不满足或上游改名，不影响编译继续）"
        done
        if grep -qE '^CONFIG_PACKAGE_.*aurora.*=[ym]' .config; then
          echo "::warning::Aurora 主题仍被选中，请检查定制脚本"
        else
          echo "OK   Aurora 已移除"
        fi
        [ "$fail" -eq 0 ] || exit 1

    - name: Download DL Package(下载DL软件包)
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        if [ -d staging_dir ]; then
          tools_stamp="$(find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -print -quit 2>/dev/null || true)"
          if [ -n "$tools_stamp" ]; then
            find staging_dir/host/stamp -maxdepth 1 -type f ! -name '.tools_compile*' -exec touch {} + 2>/dev/null || true
            find staging_dir/host -maxdepth 2 -type f -name '.tools_compile*' -exec touch {} +
          fi
          for toolchain_dir in staging_dir/toolchain-*; do
            [ -d "$toolchain_dir" ] || continue
            ts="$(find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -print -quit)"
            [ -n "$ts" ] || continue
            [ -d "$toolchain_dir/stamp" ] && find "$toolchain_dir/stamp" -maxdepth 1 -type f ! -name '.toolchain_compile*' -exec touch {} +
            find "$toolchain_dir" -maxdepth 2 -type f -name '.toolchain_compile*' -exec touch {} +
          done
        fi
        for attempt in 1 2 3; do
          if make download -j"$(nproc)"; then break; fi
          if [ "$attempt" -eq 3 ]; then
            echo "Error: make download failed after $attempt attempts" >&2; exit 1
          fi
          echo "::warning::make download 失败 (attempt $attempt/3)，清理不完整文件后重试"
          find dl -type f -size -1024c -print -delete
          sleep $((attempt * 5))
        done

    - name: Compile Firmware(开始编译固件)
      id: compile
      env:
        MTK_STATE: ${{ steps.finalconfig.outputs.mtk_state }}
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        echo -e "$(nproc) thread compile"
        LOG=/tmp/make.log
        NOT_BUILT="$OPENWRT_PATH/${ARTIFACT_PREFIX}.not-built.txt"
        : > "$NOT_BUILT"
        final_state="$MTK_STATE"

        run_make() {
          local rc=0
          make -j"$(nproc)" 2>&1 | tee "$LOG" || rc=${PIPESTATUS[0]}
          return "$rc"
        }

        # 单线程 V=s 很慢，只在「并行日志里定位不到失败包」时才跑，避免每次失败都白等一次全量串行编译
        run_make_verbose() {
          local rc=0
          echo "::warning::并行日志未能定位失败包，改用单线程 V=s 复现以获取详细错误"
          make -j1 V=s 2>&1 | tee -a "$LOG" || rc=${PIPESTATUS[0]}
          return "$rc"
        }

        find_failed_pkgs() {
          grep -hoE 'ERROR: package/[^ ]+ failed to build' "$LOG" 2>/dev/null \
            | sed -E 's#^ERROR: package/##; s# failed to build$##' | sort -u || true
        }

        ok=0
        # 最多 4 轮：先把无线栈回退处理好，再对「单包编译失败」（如 Go 版本过新、依赖缺失）自愈
        for round in 1 2 3 4; do
          echo "=============== 编译第 $round 轮 ==============="
          if run_make; then ok=1; break; fi

          if [ "$round" -eq 1 ] && [ "$final_state" = "on" ]; then
            echo "::warning::启用 MTK 闭源无线时编译失败，自动回退开源 mt76/wpad 后重编"
            tail -n 40 "$LOG" || true
            ./scripts/custom/fallback-openwrt-wifi.sh
            final_state="fallback"
            continue
          fi

          mapfile -t fail_pkgs < <(find_failed_pkgs)
          if [ "${#fail_pkgs[@]}" -eq 0 ]; then
            run_make_verbose || true
            mapfile -t fail_pkgs < <(find_failed_pkgs)
          fi
          if [ "${#fail_pkgs[@]}" -eq 0 ]; then
            echo "::error::编译失败，且无法从日志定位失败的包，以下为日志尾部："
            tail -n 80 "$LOG" || true
            exit 1
          fi
          echo "::warning::以下包编译失败，自动剔除后重试：${fail_pkgs[*]}"
          for p in "${fail_pkgs[@]}"; do
            printf '%s\n' "$p" >> "$NOT_BUILT"
            base="${p##*/}"
            rm -rf "$OPENWRT_PATH/package/$p"
            rm -rf "$OPENWRT_PATH/package/feeds"/*/"$base" 2>/dev/null || true
            rm -rf "$OPENWRT_PATH/feeds"/*/"$base" "$OPENWRT_PATH/feeds"/*/*/"$base" 2>/dev/null || true
            rm -rf "$OPENWRT_PATH/build_dir"/target-*/"$base"-* 2>/dev/null || true
          done
          rm -rf tmp/.packageinfo tmp/.packageauxvars
          make defconfig >/dev/null 2>&1 || true
        done

        if [ "$ok" -ne 1 ]; then
          echo "::error::编译最终失败（已尝试自动剔除失败包仍不通过），日志尾部："
          tail -n 100 "$LOG" || true
          exit 1
        fi
        echo "mtk_state=$final_state" >> "$GITHUB_OUTPUT"
        if [ -s "$NOT_BUILT" ]; then
          echo "::warning::本次为产出固件剔除了以下无法编译的包（详见发布说明）：$(tr '\n' ' ' < "$NOT_BUILT")"
        else
          echo "全部包编译通过，无剔除"
        fi

    - name: Check Space Usage(检查空间使用情况)
      if: ${{ !cancelled() }}
      run: df -hT

    - name: Organize Files(整理文件)
      id: organize
      run: |
        set -Eeuo pipefail
        cd "$OPENWRT_PATH"
        F="$OPENWRT_PATH/ci-out"
        rm -rf "$F"; mkdir -p "$F"
        OUT="bin/targets/${TARGET_BOARD}/${TARGET_SUBTARGET}"

        cp -f "$OUT"/*squashfs-sysupgrade.bin "$F/${ARTIFACT_PREFIX}-${DEVICE}-squashfs-sysupgrade.bin" 2>/dev/null || true
        cp -f "$OUT"/*initramfs-kernel.bin    "$F/${ARTIFACT_PREFIX}-${DEVICE}-initramfs-kernel.bin" 2>/dev/null || true
        cp -f "$OUT"/*.manifest               "$F/" 2>/dev/null || true
        cp -f "$OUT"/*.itb                    "$F/" 2>/dev/null || true
        cp -f .config                         "$F/${ARTIFACT_PREFIX}.config" 2>/dev/null || true
        cp -f config.buildinfo                "$F/" 2>/dev/null || true
        cp -f "$OPENWRT_PATH"/${ARTIFACT_PREFIX}.plugins.md "$F/" 2>/dev/null || true
        cp -f "$OPENWRT_PATH"/third-party-sources.txt "$F/" 2>/dev/null || true
        if [ -s "$OPENWRT_PATH/${ARTIFACT_PREFIX}.not-built.txt" ]; then
          cp -f "$OPENWRT_PATH/${ARTIFACT_PREFIX}.not-built.txt" "$F/"
        fi
        printf '%s\n' "$(git rev-parse HEAD)" > "$F/source-commit.txt"

        if [ ! -s "$F/${ARTIFACT_PREFIX}-${DEVICE}-squashfs-sysupgrade.bin" ]; then
          echo "Error: 未找到 sysupgrade 固件，bin/targets 内容如下：" >&2
          ls -lh "$OUT" || true
          exit 1
        fi

        # 内核版本：从 manifest 里 kmod 的 ABI 版本号取（形如 6.6.157-r1）
        KVER="$(grep -m1 -oE '^kmod-nf-conntrack - [0-9][^ ]*' "$OUT"/*.manifest 2>/dev/null | head -n1 | awk '{print $3}' | cut -d- -f1 || true)"
        [ -n "$KVER" ] || KVER=unknown
        printf '%s\n' "$KVER" > "$F/kernel-version.txt"
        echo "kernel_version=$KVER" >> "$GITHUB_OUTPUT"

        ( cd "$F" && sha256sum * > sha256sums.txt )
        rm -rf "$F"/config.buildinfo
        ls -lh "$F"
        echo "firmware_path=$F" >> "$GITHUB_OUTPUT"

    - name: Upload Firmware Artifact(上传固件产物)
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ env.ARTIFACT_PREFIX }}
        path: ${{ steps.organize.outputs.firmware_path }}/*
        if-no-files-found: error
        compression-level: 0
        overwrite: true
        retention-days: 7

  # -------------------------------------------------------------------------
  # 3) 发布：滚动 latest + 每次编译一个时间戳 tag 的新 Release
  # -------------------------------------------------------------------------
  Release:
    needs: Build
    if: ${{ always() && needs.Build.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.upload_release) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download Firmware Artifact(下载固件产物)
      uses: actions/download-artifact@v4
      with:
        name: firmware-${{ env.ARTIFACT_PREFIX }}
        path: artifacts/firmware

    - name: Release & Prune(发布固件并清理旧版本)
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION_KERNEL: ${{ needs.Build.outputs.kernel_version }}
        SOURCE_COMMIT: ${{ needs.Build.outputs.source_commit }}
        DEVICE_NAME: ${{ env.DEVICE }}
        MTK_WIFI: ${{ needs.Build.outputs.mtk_state }}
      run: |
        set -Eeuo pipefail
        chmod +x scripts/custom/release.sh
        scripts/custom/release.sh artifacts/firmware "$RELEASE_PREFIX" "$KEEP_RECENT"

  # -------------------------------------------------------------------------
  # 4) 按真实配置重写 README（含各插件版本号与上游更新日期）
  # -------------------------------------------------------------------------
  Docs:
    needs: [Sync-Upstream, Release]
    # 即使上游被跳过、编译/发布失败也要更新 README，让文档始终与仓库实际配置一致
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout(检出代码)
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch Custom Overlay(拉取定制分支配置)
      run: |
        set -Eeuo pipefail
        if git ls-remote --exit-code --heads origin "$CUSTOM_BRANCH" >/dev/null 2>&1; then
          git fetch --depth=1 --no-tags origin "$CUSTOM_BRANCH"
          rm -rf .tmp-custom && mkdir -p .tmp-custom
          git archive FETCH_HEAD "$CUSTOM_DIR" 2>/dev/null | tar -x -C .tmp-custom || true
          if [ -d ".tmp-custom/$CUSTOM_DIR" ]; then
            rm -rf "$CUSTOM_DIR"; cp -a ".tmp-custom/$CUSTOM_DIR" "$CUSTOM_DIR"
          fi
          rm -rf .tmp-custom
        fi

    - name: Collect Plugin Table(采集最新发布的插件版本表)
      id: plugins
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        out="$GITHUB_WORKSPACE/.plugins-table.md"
        : > "$out"
        if command -v gh >/dev/null 2>&1; then
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,createdAt \
                  --jq '[.[] | select(.tagName|endswith("-latest"))][0].tagName' 2>/dev/null || true)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          fi
          if [ -n "$tag" ] && [ "$tag" != "null" ]; then
            echo "读取发布说明来源: $tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > .release-body.md 2>/dev/null || true
            awk '/<!--PLUGINS:BEGIN-->/{f=1;next} /<!--PLUGINS:END-->/{f=0} f' .release-body.md > "$out" || true
          else
            echo "::warning::仓库中还没有任何 Release，插件版本表暂缺"
          fi
        fi
        echo "plugin_table=$out" >> "$GITHUB_OUTPUT"
        head -n 15 "$out" || true

    - name: Regenerate README(按实际配置重写 README)
      env:
        PLUGIN_TABLE: ${{ steps.plugins.outputs.plugin_table }}
        MTK_STATE: ${{ needs.Build.outputs.mtk_state }}
      run: |
        set -Eeuo pipefail
        chmod +x scripts/custom/gen-readme.sh
        scripts/custom/gen-readme.sh "$GITHUB_WORKSPACE" "$PLUGIN_TABLE"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ -n "$(git status --porcelain README.md)" ]; then
          git add README.md
          git commit -m "docs: 自动更新 README [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME:-$SOURCE_BRANCH}" || true
          git push origin "HEAD:${GITHUB_REF_NAME:-$SOURCE_BRANCH}" \
            || echo "::warning::README 推送失败（可能权限/冲突），不影响编译"
        else
          echo "README 无变化"
        fi
